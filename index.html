<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Замірник WIŚNIOWSKI</title>
  <meta name="theme-color" content="#1e3a5f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --primary: #1e3a5f;
      --accent: #3182ce;
      --bg: #f7fafc;
      --card: #fff;
      --border: #e2e8f0;
      --success: #38a169;
      --muted: #718096;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: #1a202c; }
    header { background: var(--primary); color: white; padding: 14px; text-align: center; position: sticky; top: 0; z-index: 100; }
    .container { max-width: 560px; margin: 0 auto; padding: 12px 16px 40px; }
    section { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    h2 { font-size: 1.05rem; margin-bottom: 12px; color: var(--primary); border-bottom: 2px solid var(--accent); padding-bottom: 6px; }
    label { display: block; font-weight: 500; margin: 10px 0 4px; font-size: .9rem; }
    input, select, textarea { width: 100%; padding: 11px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; }
    .tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; }
    .tab { flex: 1; min-width: 110px; padding: 10px 8px; border: 2px solid var(--border); border-radius: 10px; background: white; cursor: pointer; font-size: .85rem; text-align: center; }
    .tab.active { border-color: var(--accent); background: #ebf8ff; font-weight: 600; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .diagram { background: #f1f5f9; border-radius: 8px; padding: 12px; margin: 10px 0; position: relative; }
    .diagram svg { width: 100%; height: auto; }
    .meas-input { position: absolute; width: 70px; font-size: .8rem; padding: 4px; text-align: center; border: 1px solid var(--accent); border-radius: 4px; background: white; }
    .grid-canvas { border: 1px solid var(--border); border-radius: 8px; background: #e2e8f0; cursor: crosshair; touch-action: none; }
    .tools { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
    .tools button { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: white; cursor: pointer; }
    .tools button.active { background: var(--accent); color: white; }
    .door-block { border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 12px; position: relative; }
    .remove-door { position: absolute; top: 8px; right: 8px; background: #e53e3e; color: white; border: none; border-radius: 4px; padding: 2px 8px; cursor: pointer; }
    .btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 8px; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-success { background: var(--success); color: white; }
    .photo-box { border: 2px dashed var(--border); border-radius: 8px; padding: 10px; text-align: center; margin-bottom: 8px; }
    .photo-box.has { border-color: var(--success); }
    .photo-box img { max-width: 100%; max-height: 120px; margin-top: 6px; border-radius: 4px; }
    .hidden { display: none; }
    .status { text-align: center; margin-top: 8px; font-size: .85rem; color: var(--muted); }
  </style>
</head>
<body>
  <header><h1>Замірник WIŚNIOWSKI</h1></header>
  <div class="container">
    <section>
      <h2>Основні дані</h2>
      <label>Замовник</label>
      <input type="text" id="client-name" placeholder="ПІБ / компанія + телефон">
      <label>Адреса об'єкта</label>
      <input type="text" id="client-address" placeholder="Місто, вулиця, номер">
      <label>Замірщик</label>
      <input type="text" id="manager" placeholder="Ваше ім'я">
    </section>

    <section>
      <h2>Тип замірів</h2>
      <div class="tabs" id="tabs">
        <div class="tab active" data-tab="garage">Гаражні ворота</div>
        <div class="tab" data-tab="industrial">Промислові ворота</div>
        <div class="tab" data-tab="fence">Огородження</div>
        <div class="tab" data-tab="doors">Двері</div>
      </div>

      <div class="tab-content active" id="tab-garage">
        <div class="diagram" id="garage-diagram">
          <svg viewBox="0 0 360 260" id="garage-svg">
            <rect x="80" y="50" width="200" height="150" fill="none" stroke="#1e3a5f" stroke-width="3"/>
            <text x="180" y="130" text-anchor="middle" font-size="16" fill="#1e3a5f">So</text>
            <text x="50" y="130" text-anchor="middle" font-size="14" fill="#1e3a5f" transform="rotate(-90 50 130)">Ho</text>
            <line x1="80" y1="30" x2="280" y2="30" stroke="#3182ce" stroke-width="2"/>
            <text x="180" y="22" text-anchor="middle" font-size="12" fill="#3182ce">N</text>
            <line x1="50" y1="50" x2="50" y2="200" stroke="#3182ce" stroke-width="2"/>
            <text x="38" y="125" text-anchor="middle" font-size="12" fill="#3182ce" transform="rotate(-90 38 125)">W1</text>
            <line x1="310" y1="50" x2="310" y2="200" stroke="#3182ce" stroke-width="2"/>
            <text x="322" y="125" text-anchor="middle" font-size="12" fill="#3182ce" transform="rotate(90 322 125)">W2</text>
            <text x="180" y="230" text-anchor="middle" font-size="11" fill="#718096">Проріз (вигляд ззовні)</text>
          </svg>
          <input class="meas-input" id="g-so" data-field="so" placeholder="So" style="top: 115px; left: 145px;">
          <input class="meas-input" id="g-ho" data-field="ho" placeholder="Ho" style="top: 115px; left: 10px; transform: rotate(-90deg); transform-origin: center;">
          <input class="meas-input" id="g-n" data-field="n" placeholder="N" style="top: 5px; left: 145px;">
          <input class="meas-input" id="g-w1" data-field="w1" placeholder="W1" style="top: 110px; left: 5px;">
          <input class="meas-input" id="g-w2" data-field="w2" placeholder="W2" style="top: 110px; right: 5px;">
          <input class="meas-input" id="g-eo" data-field="eo" placeholder="Eo" style="bottom: 30px; left: 145px;">
        </div>
        <label>Колір RAL / декор</label>
        <input type="text" id="g-ral" data-field="ral">
        <label>Керування</label>
        <select id="g-control" data-field="control">
          <option value="">—</option>
          <option>Ручне</option>
          <option>Автоматика</option>
          <option>Пульт / смартфон</option>
        </select>
      </div>

      <div class="tab-content" id="tab-industrial">
        <p style="color:var(--muted); margin-bottom:8px;">Аналогічно гаражним (MakroPro / Invest / Alu)</p>
        <div class="diagram">
          <svg viewBox="0 0 360 200"><rect x="80" y="40" width="200" height="120" fill="none" stroke="#1e3a5f" stroke-width="3"/><text x="180" y="105" text-anchor="middle">So / Ho</text></svg>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
          <div><label>So (мм)</label><input type="number" id="i-so" data-field="so"></div>
          <div><label>Ho (мм)</label><input type="number" id="i-ho" data-field="ho"></div>
        </div>
        <label>N / W1 / W2 / Eo</label>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
          <input type="number" id="i-n" data-field="n" placeholder="N">
          <input type="number" id="i-eo" data-field="eo" placeholder="Eo">
          <input type="number" id="i-w1" data-field="w1" placeholder="W1">
          <input type="number" id="i-w2" data-field="w2" placeholder="W2">
        </div>
        <label>Колір</label><input type="text" id="i-ral" data-field="ral">
      </div>

      <div class="tab-content" id="tab-fence">
        <label>Загальна довжина (м)</label>
        <input type="number" id="f-len" data-field="length" step="0.1">
        <label>Висота (мм)</label>
        <input type="number" id="f-h" data-field="height">
        <label>Колір RAL</label>
        <input type="text" id="f-ral" data-field="ral">
        <div class="tools">
          <button type="button" id="tool-line" class="active">Лінія</button>
          <button type="button" id="tool-gate">Ворота</button>
          <button type="button" id="tool-wicket">Хвіртка</button>
          <button type="button" id="tool-clear">Очистити</button>
        </div>
        <canvas id="fence-canvas" class="grid-canvas" width="340" height="280"></canvas>
        <p style="font-size:.75rem; color:var(--muted); margin-top:6px;">Клікніть для точок. Лінія з’єднує послідовно. Ворота/хвіртка — виберіть тип після розміщення.</p>
      </div>

      <div class="tab-content" id="tab-doors">
        <div id="doors-list"></div>
        <button type="button" class="btn" style="background:#edf2f7;" onclick="addDoor()">+ Додати двері</button>
      </div>
    </section>

    <section>
      <h2>Фото об'єкта</h2>
      <div id="photos"></div>
      <label>Примітки для спеціаліста</label>
      <textarea id="notes" placeholder="Нерівності, комунікації, особливі умови..."></textarea>
    </section>

    <section>
      <button class="btn btn-primary" onclick="shareArchive()">Поділитися архівом</button>
      <button class="btn btn-success" onclick="downloadArchive()">Завантажити ZIP</button>
      <div class="status" id="status"></div>
    </section>
  </div>

  <script>
    document.querySelectorAll('.tab').forEach(t => {
      t.onclick = () => {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        document.getElementById('tab-' + t.dataset.tab).classList.add('active');
      };
    });

    const photoTypes = [
      { id: 'front', label: 'Фасад / загальний вигляд' },
      { id: 'inside', label: 'Зсередини' },
      { id: 'lintel', label: 'Перемичка' },
      { id: 'sides', label: 'Бічні відступи' },
      { id: 'floor', label: 'Підлога' },
      { id: 'extra', label: 'Додатково' }
    ];
    document.getElementById('photos').innerHTML = photoTypes.map(p => `
      <div class="photo-box" id="box-${p.id}">
        <strong>${p.label}</strong><br>
        <input type="file" accept="image/*" capture="environment" data-id="${p.id}" onchange="onPhoto(this)">
        <div class="preview"></div>
      </div>
    `).join('');

    let photos = {};
    function onPhoto(input) {
      const id = input.dataset.id;
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        photos[id] = { name: file.name, blob: file, dataUrl: e.target.result };
        const box = document.getElementById('box-' + id);
        box.classList.add('has');
        box.querySelector('.preview').innerHTML = `<img src="${e.target.result}">`;
      };
      reader.readAsDataURL(file);
    }

    let doorCount = 0;
    function addDoor() {
      doorCount++;
      const id = 'door-' + doorCount;
      const div = document.createElement('div');
      div.className = 'door-block';
      div.id = id;
      div.innerHTML = `
        <button class="remove-door" onclick="this.parentElement.remove()">×</button>
        <label>Тип</label>
        <select data-field="type">
          <option>CREO</option><option>Deco</option><option>Профільні</option><option>ECO</option><option>Вогнестійкі</option>
        </select>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px;">
          <div><label>Ширина (мм)</label><input type="number" data-field="w"></div>
          <div><label>Висота (мм)</label><input type="number" data-field="h"></div>
        </div>
        <label>Коробка / стіна</label><input type="text" data-field="frame">
        <label>Колір / декор</label><input type="text" data-field="color">
        <label>Фурнітура</label><input type="text" data-field="hw">
      `;
      document.getElementById('doors-list').appendChild(div);
    }
    addDoor();

    const canvas = document.getElementById('fence-canvas');
    const ctx = canvas.getContext('2d');
    let points = [];
    let markers = [];
    let tool = 'line';
    document.getElementById('tool-line').onclick = () => tool = 'line';
    document.getElementById('tool-gate').onclick = () => tool = 'gate';
    document.getElementById('tool-wicket').onclick = () => tool = 'wicket';
    document.getElementById('tool-clear').onclick = () => { points = []; markers = []; draw(); };

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#cbd5e0';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 20) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 20) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }
      if (points.length > 1) {
        ctx.strokeStyle = '#1e3a5f';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
        ctx.stroke();
      }
      points.forEach(p => {
        ctx.fillStyle = '#3182ce';
        ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI * 2); ctx.fill();
      });
      markers.forEach(m => {
        ctx.fillStyle = m.type === 'gate' ? '#38a169' : '#dd6b20';
        ctx.fillRect(m.x - 12, m.y - 8, 24, 16);
        ctx.fillStyle = 'white';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(m.label || (m.type === 'gate' ? 'В' : 'Х'), m.x, m.y + 4);
      });
    }
    draw();

    canvas.onclick = (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      if (tool === 'line') {
        points.push({ x, y });
      } else if (tool === 'gate') {
        const label = prompt('Ворота: Л або П (відкатні)', 'Л') || 'Л';
        markers.push({ type: 'gate', x, y, label });
      } else if (tool === 'wicket') {
        const label = prompt('Хвіртка: ЛЗ / ЛВ / ПЗ / ПВ', 'ЛЗ') || 'ЛЗ';
        markers.push({ type: 'wicket', x, y, label });
      }
      draw();
    };

    function collect() {
      const base = {
        date: new Date().toISOString(),
        manager: document.getElementById('manager').value,
        client: {
          name: document.getElementById('client-name').value,
          address: document.getElementById('client-address').value
        },
        notes: document.getElementById('notes').value,
        measurements: {}
      };

      const g = {};
      document.querySelectorAll('#tab-garage [data-field]').forEach(el => {
        if (el.value) g[el.dataset.field] = el.value;
      });
      if (Object.keys(g).length) base.measurements.garage = g;

      const i = {};
      document.querySelectorAll('#tab-industrial [data-field]').forEach(el => {
        if (el.value) i[el.dataset.field] = el.value;
      });
      if (Object.keys(i).length) base.measurements.industrial = i;

      const f = {};
      document.querySelectorAll('#tab-fence [data-field]').forEach(el => {
        if (el.value) f[el.dataset.field] = el.value;
      });
      if (points.length || markers.length) {
        f.points = points;
        f.markers = markers;
      }
      if (Object.keys(f).length) base.measurements.fence = f;

      const doors = [];
      document.querySelectorAll('#doors-list .door-block').forEach(block => {
        const d = {};
        block.querySelectorAll('[data-field]').forEach(el => {
          if (el.value) d[el.dataset.field] = el.value;
        });
        if (Object.keys(d).length) doors.push(d);
      });
      if (doors.length) base.measurements.doors = doors;

      base.photoCount = Object.keys(photos).length;
      return base;
    }

    async function buildZip() {
      const data = collect();
      const zip = new JSZip();
      zip.file('zamir.json', JSON.stringify(data, null, 2));
      let n = 1;
      for (const [id, p] of Object.entries(photos)) {
        if (p.blob) {
          const ext = (p.name.split('.').pop() || 'jpg').toLowerCase();
          zip.file(`photo_${n}_${id}.${ext}`, p.blob);
          n++;
        }
      }
      const blob = await zip.generateAsync({ type: 'blob' });
      const filename = `zamir-${Date.now()}.zip`;
      return { blob, filename, data };
    }

    async function shareArchive() {
      const status = document.getElementById('status');
      status.textContent = 'Пакуємо...';
      try {
        const { blob, filename, data } = await buildZip();
        const file = new File([blob], filename, { type: 'application/zip' });
        const text = `Замір WIŚNIOWSKI\nЗамірщик: ${data.manager}\nАдреса: ${data.client.address}`;
        if (navigator.share && navigator.canShare?.({ files: [file] })) {
          await navigator.share({ title: 'Замір WIŚNIOWSKI', text, files: [file] });
          status.textContent = 'Надіслано через «Поділитися»';
        } else {
          downloadBlob(blob, filename);
          status.textContent = 'ZIP завантажено';
        }
      } catch (e) {
        status.textContent = 'Помилка: ' + e.message;
      }
    }

    async function downloadArchive() {
      const status = document.getElementById('status');
      status.textContent = 'Пакуємо...';
      try {
        const { blob, filename } = await buildZip();
        downloadBlob(blob, filename);
        status.textContent = 'ZIP завантажено';
      } catch (e) {
        status.textContent = 'Помилка: ' + e.message;
      }
    }

    function downloadBlob(blob, name) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js').catch(() => {});
  </script>
</body>
</html>
