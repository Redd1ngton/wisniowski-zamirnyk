<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Замірник WIŚNIOWSKI</title>
  <meta name="theme-color" content="#1e3a5f">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root { --primary: #1e3a5f; --accent: #3182ce; --bg: #f7fafc; --border: #e2e8f0; --success: #38a169; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); }
    header { background: var(--primary); color: white; padding: 14px; text-align: center; position: sticky; top: 0; z-index: 100; }
    .container { max-width: 560px; margin: 0 auto; padding: 12px 16px 40px; }
    section { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    h2 { font-size: 1.05rem; margin-bottom: 12px; color: var(--primary); border-bottom: 2px solid var(--accent); padding-bottom: 6px; }
    label { display: block; font-weight: 500; margin: 10px 0 4px; font-size: .9rem; }
    input, select, textarea { width: 100%; padding: 11px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; }
    .tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; }
    .tab { flex: 1; min-width: 100px; padding: 10px 6px; border: 2px solid var(--border); border-radius: 10px; background: white; cursor: pointer; font-size: .8rem; text-align: center; }
    .tab.active { border-color: var(--accent); background: #ebf8ff; font-weight: 600; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .diagram { background: #f1f5f9; border-radius: 8px; padding: 12px; margin: 10px 0; position: relative; }
    .meas-input { position: absolute; width: 64px; font-size: .75rem; padding: 3px; text-align: center; border: 1px solid var(--accent); border-radius: 4px; background: white; }
    .grid-canvas { border: 1px solid var(--border); border-radius: 8px; background: #e2e8f0; cursor: crosshair; }
    .tools { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
    .tools button { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: white; cursor: pointer; font-size: .85rem; }
    .door-block { border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 12px; position: relative; }
    .remove-door { position: absolute; top: 6px; right: 6px; background: #e53e3e; color: white; border: none; border-radius: 4px; padding: 2px 7px; cursor: pointer; }
    .btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 8px; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-success { background: var(--success); color: white; }
    .photo-box { border: 2px dashed var(--border); border-radius: 8px; padding: 10px; text-align: center; margin-bottom: 8px; }
    .photo-box.has { border-color: var(--success); }
    .photo-box img { max-width: 100%; max-height: 110px; margin-top: 6px; }
    .status { text-align: center; margin-top: 8px; font-size: .85rem; color: #718096; }
  </style>
</head>
<body>
  <header><h1>Замірник WIŚNIOWSKI</h1></header>
  <div class="container">
    <section>
      <h2>Основні дані</h2>
      <label>Замовник</label><input type="text" id="client-name" placeholder="ПІБ / компанія + телефон">
      <label>Адреса об'єкта</label><input type="text" id="client-address" placeholder="Місто, вулиця, номер">
      <label>Замірщик</label><input type="text" id="manager" placeholder="Ваше ім'я">
    </section>

    <section>
      <h2>Тип замірів</h2>
      <div class="tabs">
        <div class="tab active" data-tab="garage">Гаражні</div>
        <div class="tab" data-tab="industrial">Промислові</div>
        <div class="tab" data-tab="fence">Огородження</div>
        <div class="tab" data-tab="doors">Двері</div>
      </div>

      <div class="tab-content active" id="tab-garage">
        <div class="diagram">
          <svg viewBox="0 0 340 240" style="width:100%">
            <rect x="70" y="45" width="200" height="140" fill="none" stroke="#1e3a5f" stroke-width="3"/>
            <text x="170" y="120" text-anchor="middle" font-size="15" fill="#1e3a5f">So</text>
            <text x="40" y="120" text-anchor="middle" font-size="13" fill="#1e3a5f" transform="rotate(-90 40 120)">Ho</text>
            <line x1="70" y1="28" x2="270" y2="28" stroke="#3182ce" stroke-width="2"/>
            <text x="170" y="20" text-anchor="middle" font-size="11" fill="#3182ce">N</text>
            <line x1="40" y1="45" x2="40" y2="185" stroke="#3182ce" stroke-width="2"/>
            <text x="28" y="115" text-anchor="middle" font-size="11" fill="#3182ce" transform="rotate(-90 28 115)">W1</text>
            <line x1="300" y1="45" x2="300" y2="185" stroke="#3182ce" stroke-width="2"/>
            <text x="312" y="115" text-anchor="middle" font-size="11" fill="#3182ce" transform="rotate(90 312 115)">W2</text>
            <text x="170" y="215" text-anchor="middle" font-size="10" fill="#718096">Проріз (ззовні)</text>
          </svg>
          <input class="meas-input" data-field="so" placeholder="So" style="top:100px;left:135px">
          <input class="meas-input" data-field="ho" placeholder="Ho" style="top:100px;left:5px;transform:rotate(-90deg)">
          <input class="meas-input" data-field="n" placeholder="N" style="top:2px;left:135px">
          <input class="meas-input" data-field="w1" placeholder="W1" style="top:95px;left:2px">
          <input class="meas-input" data-field="w2" placeholder="W2" style="top:95px;right:2px">
          <input class="meas-input" data-field="eo" placeholder="Eo" style="bottom:25px;left:135px">
        </div>
        <label>Колір RAL</label><input type="text" data-field="ral">
        <label>Керування</label>
        <select data-field="control"><option value="">—</option><option>Ручне</option><option>Автоматика</option><option>Пульт/смартфон</option></select>
      </div>

      <div class="tab-content" id="tab-industrial">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <div><label>So (мм)</label><input type="number" data-field="so"></div>
          <div><label>Ho (мм)</label><input type="number" data-field="ho"></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
          <input type="number" data-field="n" placeholder="N">
          <input type="number" data-field="eo" placeholder="Eo">
          <input type="number" data-field="w1" placeholder="W1">
          <input type="number" data-field="w2" placeholder="W2">
        </div>
        <label>Колір</label><input type="text" data-field="ral">
      </div>

      <div class="tab-content" id="tab-fence">
        <label>Довжина (м)</label><input type="number" data-field="length" step="0.1">
        <label>Висота (мм)</label><input type="number" data-field="height">
        <label>Колір RAL</label><input type="text" data-field="ral">
        <div class="tools">
          <button type="button" id="tool-line">Лінія</button>
          <button type="button" id="tool-gate">Ворота</button>
          <button type="button" id="tool-wicket">Хвіртка</button>
          <button type="button" id="tool-clear">Очистити</button>
        </div>
        <canvas id="fence-canvas" class="grid-canvas" width="320" height="260"></canvas>
      </div>

      <div class="tab-content" id="tab-doors">
        <div id="doors-list"></div>
        <button type="button" class="btn" style="background:#edf2f7" onclick="addDoor()">+ Додати двері</button>
      </div>
    </section>

    <section>
      <h2>Фото об'єкта</h2>
      <div id="photos"></div>
      <label>Примітки</label>
      <textarea id="notes" placeholder="Нерівності, комунікації, особливі умови..."></textarea>
    </section>

    <section>
      <button class="btn btn-primary" onclick="shareArchive()">Поділитися архівом (PDF)</button>
      <button class="btn btn-success" onclick="downloadArchive()">Завантажити ZIP з PDF</button>
      <div class="status" id="status"></div>
    </section>
  </div>

  <script>
    document.querySelectorAll('.tab').forEach(t => {
      t.onclick = () => {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        document.getElementById('tab-' + t.dataset.tab).classList.add('active');
      };
    });

    const photoTypes = [
      {id:'front', label:'Фасад'}, {id:'inside', label:'Зсередини'},
      {id:'lintel', label:'Перемичка'}, {id:'sides', label:'Бічні'},
      {id:'floor', label:'Підлога'}, {id:'extra', label:'Додатково'}
    ];
    document.getElementById('photos').innerHTML = photoTypes.map(p => `
      <div class="photo-box" id="box-${p.id}">
        <strong>${p.label}</strong><br>
        <input type="file" accept="image/*" capture="environment" data-id="${p.id}" onchange="onPhoto(this)">
        <div class="preview"></div>
      </div>`).join('');

    let photos = {};
    function onPhoto(input) {
      const id = input.dataset.id, file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        photos[id] = {name: file.name, blob: file, dataUrl: e.target.result};
        const box = document.getElementById('box-'+id);
        box.classList.add('has');
        box.querySelector('.preview').innerHTML = `<img src="${e.target.result}">`;
      };
      reader.readAsDataURL(file);
    }

    let doorCount = 0;
    function addDoor() {
      doorCount++;
      const div = document.createElement('div');
      div.className = 'door-block';
      div.innerHTML = `
        <button class="remove-door" onclick="this.parentElement.remove()">×</button>
        <label>Тип</label>
        <select data-field="type"><option>CREO</option><option>Deco</option><option>Профільні</option><option>ECO</option><option>Вогнестійкі</option></select>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
          <div><label>Ширина</label><input type="number" data-field="w"></div>
          <div><label>Висота</label><input type="number" data-field="h"></div>
        </div>
        <label>Коробка/стіна</label><input type="text" data-field="frame">
        <label>Колір</label><input type="text" data-field="color">
        <label>Фурнітура</label><input type="text" data-field="hw">
      `;
      document.getElementById('doors-list').appendChild(div);
    }
    addDoor();

    const canvas = document.getElementById('fence-canvas');
    const ctx = canvas.getContext('2d');
    let points = [], markers = [], tool = 'line';
    document.getElementById('tool-line').onclick = () => tool = 'line';
    document.getElementById('tool-gate').onclick = () => tool = 'gate';
    document.getElementById('tool-wicket').onclick = () => tool = 'wicket';
    document.getElementById('tool-clear').onclick = () => { points=[]; markers=[]; draw(); };
    function draw() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.strokeStyle='#cbd5e0'; ctx.lineWidth=1;
      for(let x=0;x<canvas.width;x+=20){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke();}
      for(let y=0;y<canvas.height;y+=20){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();}
      if(points.length>1){
        ctx.strokeStyle='#1e3a5f'; ctx.lineWidth=3; ctx.beginPath();
        ctx.moveTo(points[0].x,points[0].y);
        for(let i=1;i<points.length;i++) ctx.lineTo(points[i].x,points[i].y);
        ctx.stroke();
      }
      points.forEach(p=>{ctx.fillStyle='#3182ce';ctx.beginPath();ctx.arc(p.x,p.y,5,0,Math.PI*2);ctx.fill();});
      markers.forEach(m=>{
        ctx.fillStyle=m.type==='gate'?'#38a169':'#dd6b20';
        ctx.fillRect(m.x-14,m.y-9,28,18);
        ctx.fillStyle='white'; ctx.font='10px sans-serif'; ctx.textAlign='center';
        ctx.fillText(m.label||(m.type==='gate'?'В':'Х'), m.x, m.y+4);
      });
    }
    draw();
    canvas.onclick = e => {
      const r = canvas.getBoundingClientRect();
      const x = e.clientX - r.left, y = e.clientY - r.top;
      if(tool==='line') points.push({x,y});
      else if(tool==='gate') markers.push({type:'gate',x,y,label:prompt('Ворота: Л або П','Л')||'Л'});
      else if(tool==='wicket') markers.push({type:'wicket',x,y,label:prompt('Хвіртка: ЛЗ/ЛВ/ПЗ/ПВ','ЛЗ')||'ЛЗ'});
      draw();
    };

    function collect() {
      const data = {
        date: new Date().toLocaleString('uk-UA'),
        manager: document.getElementById('manager').value,
        client: {
          name: document.getElementById('client-name').value,
          address: document.getElementById('client-address').value
        },
        notes: document.getElementById('notes').value,
        measurements: {}
      };
      const grab = sel => {
        const o = {};
        document.querySelectorAll(sel).forEach(el => { if(el.value) o[el.dataset.field]=el.value; });
        return Object.keys(o).length ? o : null;
      };
      const g = grab('#tab-garage [data-field]'); if(g) data.measurements.garage = g;
      const i = grab('#tab-industrial [data-field]'); if(i) data.measurements.industrial = i;
      const f = grab('#tab-fence [data-field]') || {};
      if(points.length || markers.length) { f.points = points; f.markers = markers; }
      if(Object.keys(f).length) data.measurements.fence = f;
      const doors = [];
      document.querySelectorAll('#doors-list .door-block').forEach(b => {
        const d = {};
        b.querySelectorAll('[data-field]').forEach(el => { if(el.value) d[el.dataset.field]=el.value; });
        if(Object.keys(d).length) doors.push(d);
      });
      if(doors.length) data.measurements.doors = doors;
      return data;
    }

    async function generatePDF(data) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'mm', format: 'a4' });
      let y = 15;
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(16);
      doc.text('Бланк замірів WIŚNIOWSKI', 105, y, { align: 'center' });
      y += 10;
      doc.setFontSize(11);
      doc.setFont('helvetica', 'normal');
      doc.text(`Дата: ${data.date}`, 15, y); y += 6;
      doc.text(`Замірщик: ${data.manager || '—'}`, 15, y); y += 6;
      doc.text(`Замовник: ${data.client.name || '—'}`, 15, y); y += 6;
      doc.text(`Адреса: ${data.client.address || '—'}`, 15, y); y += 10;

      const addSection = (title, obj) => {
        if (!obj) return;
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(13);
        doc.text(title, 15, y); y += 7;
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(11);
        Object.entries(obj).forEach(([k,v]) => {
          if (k === 'points' || k === 'markers') return;
          doc.text(`${k}: ${v}`, 20, y); y += 6;
          if (y > 270) { doc.addPage(); y = 15; }
        });
        y += 4;
      };

      addSection('Гаражні ворота', data.measurements.garage);
      addSection('Промислові ворота', data.measurements.industrial);

      if (data.measurements.fence) {
        addSection('Огородження', data.measurements.fence);
        if (points.length || markers.length) {
          const img = canvas.toDataURL('image/png');
          if (y > 180) { doc.addPage(); y = 15; }
          doc.addImage(img, 'PNG', 15, y, 80, 65);
          y += 70;
        }
      }

      if (data.measurements.doors) {
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(13);
        doc.text('Двері', 15, y); y += 7;
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(11);
        data.measurements.doors.forEach((d, idx) => {
          doc.text(`Двері ${idx+1}:`, 20, y); y += 6;
          Object.entries(d).forEach(([k,v]) => {
            doc.text(`  ${k}: ${v}`, 25, y); y += 5;
            if (y > 270) { doc.addPage(); y = 15; }
          });
          y += 3;
        });
      }

      if (data.notes) {
        if (y > 250) { doc.addPage(); y = 15; }
        doc.setFont('helvetica', 'bold');
        doc.text('Примітки:', 15, y); y += 6;
        doc.setFont('helvetica', 'normal');
        const lines = doc.splitTextToSize(data.notes, 170);
        doc.text(lines, 15, y);
      }

      return doc.output('blob');
    }

    async function buildZip() {
      const data = collect();
      const zip = new JSZip();
      const pdfBlob = await generatePDF(data);
      zip.file('бланк_замірів.pdf', pdfBlob);
      let n = 1;
      for (const [id, p] of Object.entries(photos)) {
        if (p.blob) {
          const ext = (p.name.split('.').pop() || 'jpg').toLowerCase();
          zip.file(`фото_${n}_${id}.${ext}`, p.blob);
          n++;
        }
      }
      const blob = await zip.generateAsync({ type: 'blob' });
      return { blob, filename: `zamir_${Date.now()}.zip`, data };
    }

    async function shareArchive() {
      const status = document.getElementById('status');
      status.textContent = 'Генеруємо PDF...';
      try {
        const { blob, filename, data } = await buildZip();
        const file = new File([blob], filename, { type: 'application/zip' });
        const text = `Замір WIŚNIOWSKI\n${data.manager}\n${data.client.address}`;
        if (navigator.share && navigator.canShare?.({ files: [file] })) {
          await navigator.share({ title: 'Замір WIŚNIOWSKI', text, files: [file] });
          status.textContent = 'Надіслано';
        } else {
          downloadBlob(blob, filename);
          status.textContent = 'ZIP завантажено';
        }
      } catch (e) { status.textContent = 'Помилка: ' + e.message; }
    }

    async function downloadArchive() {
      const status = document.getElementById('status');
      status.textContent = 'Генеруємо PDF...';
      try {
        const { blob, filename } = await buildZip();
        downloadBlob(blob, filename);
        status.textContent = 'ZIP завантажено';
      } catch (e) { status.textContent = 'Помилка: ' + e.message; }
    }

    function downloadBlob(blob, name) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  </script>
</body>
</html>
